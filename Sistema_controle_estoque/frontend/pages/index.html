<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Produtos</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/frontend/js/buscar.js" defer></script>
  <script src="/frontend/js/cadastrar.js" defer></script>
</head>
<body>
  <header>
    <i class="fa-solid fa-barcode"></i> Sistema de Controle de Produtos
  </header>

  <div class="container">
  <div class="panel">
    <h2>Consultar Produto</h2>
    <label for="codigo"><i class="fa-solid fa-barcode"></i> Código de Barras:</label>
    <input type="text" id="codigo" placeholder="Digite o código de barras">
    <button id="botaoBuscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar Produto</button>
    
    <div id="resultado"></div>
  </div>

    <div class="funcoes">
      <button type="button" class="funcao" id="BotaoCadastrar">
        <i class="fa-solid fa-clipboard-list"></i>
        <p>Cadastrar</p>
      </button>
      <button type="button" class="funcao" id="botaoEstoque">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>Estoque</p>
      </button>
      <button type="button" class="funcao" id="botaoMovimentacoes">
        <i class="fa-solid fa-arrows-rotate"></i>
        <p>Movimentações</p>
      </button>
      <button type="button" class="funcao" id="botaoUsuarios">
        <i class="fa-solid fa-user"></i>
        <p>Usuários</p>
      </button>
    </div>
  </div>

  <dialog id="modalCadastro" class="modal-cadastro" aria-labelledby="tituloCadastro">
    <form id="formCadastro">
      <div class="modal-cabecalho">
        <div>
          <h2 id="tituloCadastro">Cadastrar Produto</h2>
          <p>Preencha os dados para adicionar um produto ao estoque.</p>
        </div>
        <button type="button" id="fecharCadastro" class="botao-fechar-modal" aria-label="Fechar formulário">&times;</button>
      </div>

      <div id="mensagemCadastro" class="mensagem-cadastro" role="status" aria-live="polite"></div>

      <label for="codigoBarras">Código de barras <span>*</span></label>
      <input type="text" id="codigoBarras" name="codigo_barras" placeholder="Digite ou escaneie o código" required>

      <label for="nomeProduto">Nome do produto <span>*</span></label>
      <input type="text" id="nomeProduto" name="nome_produto" placeholder="Ex.: Arroz tipo 1, 5 kg" required>

      <div class="campos-cadastro-linha">
        <div>
          <label for="valorProduto">Preço de venda <span>*</span></label>
          <input type="number" id="valorProduto" name="valor_prod" min="0.01" step="0.01" placeholder="0,00" required>
        </div>
        <div>
          <label for="setorProduto">ID do setor <span>*</span></label>
          <input type="number" id="setorProduto" name="setor_id" min="1" step="1" placeholder="Ex.: 1" required>
        </div>
      </div>

      <p class="dica-cadastro">Use o ID de um setor já cadastrado no sistema.</p>

      <div class="modal-acoes">
        <button type="button" id="cancelarCadastro" class="botao-cancelar">Cancelar</button>
        <button type="submit" id="enviarCadastro" class="botao-enviar-cadastro">Cadastrar produto</button>
      </div>
    </form>
  </dialog>
</body>
</html>
