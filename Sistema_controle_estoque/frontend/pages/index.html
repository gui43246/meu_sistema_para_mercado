<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Produtos</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <i class="fa-solid fa-barcode"></i> Sistema de Controle de Produtos
  </header>

  <div class="container">
    <div class="panel">
      <h2>Consultar Produto</h2>
      <label for="codigo"><i class="fa-solid fa-barcode"></i> Código de Barras:</label>
      <input type="text" id="codigo" placeholder="Digite o código de barras">
      <button><i class="fa-solid fa-magnifying-glass"></i> Buscar Produto</button>
    </div>

    <div class="funcoes">
      <div class="funcao">
        <i class="fa-solid fa-clipboard-list"></i>
        <p>Cadastrar</p>
      </div>
      <div class="funcao">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>Estoque</p>
      </div>
      <div class="funcao">
        <i class="fa-solid fa-arrows-rotate"></i>
        <p>Movimentações</p>
      </div>
      <div class="funcao">
        <i class="fa-solid fa-user"></i>
        <p>Usuários</p>
      </div>
    </div>
  </div>
</body>
</html>
