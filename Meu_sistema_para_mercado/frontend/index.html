<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Controle de Produtos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
    }
    header i {
      margin-right: 10px;
    }
    .container {
      display: flex;
      justify-content: space-around;
      margin: 30px;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 40%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .panel h2 {
      color: #007BFF;
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #0056b3;
    }
    footer {
      background-color: #eaeaea;
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }
    footer i {
      margin: 0 10px;
      color: #007BFF;
    }
  </style>
</head>
<body>
  <header>
    <i class="fa fa-barcode"></i> Sistema de Controle de Produtos
  </header>

  <div class="container">
    <!-- Consultar Produto -->
    <div class="panel">
      <h2>Consultar Produto</h2>
      <label for="codigo"><i class="fa fa-barcode"></i> Código de Barras:</label>
      <input type="text" id="codigo" placeholder="Digite o código de barras">
      <button><i class="fa fa-search"></i> Buscar Produto</button>
    </div>

    <!-- Login para Editar -->
    <div class="panel">
      <h2>Login de Acesso</h2>
      <label for="drt"><i class="fa fa-user"></i> DRT:</label>
      <input type="text" id="drt" placeholder="Digite seu DRT">
      <label for="senha"><i class="fa fa-lock"></i> Senha:</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
      <button><i class="fa fa-sign-in-alt"></i> Entrar</button>
    </div>
  </div>

  <footer>
    <i class="fa fa-shopping-cart"></i> Estoque
    <i class="fa fa-clipboard-list"></i> Relatórios
  </footer>
</body>
</html>
